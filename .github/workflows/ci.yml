name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, unit tests, scenario coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Both flavors must compile: demo is what runs in tests, prod is what would ship.
      - name: Build
        run: ./gradlew :app:assembleDemoDebug :app:compileProdDebugKotlin

      # Includes the end-to-end tests, which run here on the JVM under Robolectric.
      - name: Unit tests
        run: ./gradlew :domain:test :fakebackend:test testDebugUnitTest :app:testDemoDebugUnitTest --continue

      - name: Test summary
        if: always()
        run: python3 tools/test_summary.py .

      # Fails if a scenario lost its last passing test, or a test claims a scenario that does not exist.
      - name: Scenario coverage
        run: python3 tools/scenario_coverage.py --results . --min 80 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  device-tests:
    name: End-to-end tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The same EndToEndTest file as above, this time against the real framework.
      - name: Run on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDemoDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  benchmark:
    name: Screen-load benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A report, not a gate: shared runners are too noisy to fail a build on a timing.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run
        run: ./gradlew :data:testDebugUnitTest -Pbenchmark -PbenchmarkRuns=15
      - name: Publish table
        run: cat build/benchmark/screen_load.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: screen-load-benchmark
          path: build/benchmark/
